- id: hvac_priority
  alias: HVAC Priority Room Selection
  mode: restart
  description: Determine priority room for HVAC based on deviation, delay, and night mode rules.

  trigger:
    - platform: time_pattern
      minutes: "/1"

  variables:

    # --- Temps ---
    bedroom_temp: "{{ states('sensor.temperature_sensor_bedroom_temperature') | float }}"
    office_temp: "{{ states('sensor.temperature_sensor_office_temperature') | float }}"
    living_temp: "{{ states('sensor.temperature_sensor_living_room_temperature') | float }}"
    first_temp: "{{ states('sensor.temperature_sensor_first_floor_temperature') | float }}"

    # --- Setpoints ---
    bedroom_sp: "{{ states('input_number.bedroom_setpoint') | float }}"
    office_sp: "{{ states('input_number.office_setpoint') | float }}"
    living_sp: "{{ states('input_number.living_room_setpoint') | float }}"
    first_sp: "{{ states('input_number.first_floor_setpoint') | float }}"

    # --- Deviations ---
    bedroom_dev: "{{ bedroom_temp - bedroom_sp }}"
    office_dev: "{{ office_temp - office_sp }}"
    living_dev: "{{ living_temp - living_sp }}"
    first_dev: "{{ first_temp - first_sp }}"

    # --- Room needs (±0.4°F) ---
    bedroom_need: >
      {% if bedroom_dev < -0.4 %}heat
      {% elif bedroom_dev > 0.4 %}cool
      {% else %}none
      {% endif %}
    office_need: >
      {% if office_dev < -0.4 %}heat
      {% elif office_dev > 0.4 %}cool
      {% else %}none
      {% endif %}
    living_need: >
      {% if living_dev < -0.4 %}heat
      {% elif living_dev > 0.4 %}cool
      {% else %}none
      {% endif %}
    first_need: >
      {% if first_dev < -0.4 %}heat
      {% elif first_dev > 0.4 %}cool
      {% else %}none
      {% endif %}

    # --- Night Mode Settings ---
    night_start: "{{ states('input_datetime.night_mode_start') }}"
    night_end: "{{ states('input_datetime.night_mode_end') }}"
    night_threshold: "{{ states('input_number.night_nonpriority_threshold') | float }}"

    # --- Local Time as HH:MM:SS ---
    now_local: "{{ now().astimezone().strftime('%H:%M:%S') }}"

    # --- Safe night-mode check (string 24-hour compare) ---
    is_night: >
      {% set start = night_start %}
      {% set end = night_end %}
      {% set now = now_local %}
      {% if start < end %}
        {{ start <= now <= end }}
      {% else %}
        {{ now >= start or now <= end }}
      {% endif %}

  action:
    - choose:

        ##################################################################
        # NIGHT MODE LOGIC
        ##################################################################
        - conditions:
            - condition: template
              value_template: "{{ is_night }}"
          sequence:

            - variables:
                night_devs:
                  bedroom: "{{ bedroom_dev }}"
                  office: "{{ office_dev }}"
                  living: "{{ living_dev }}"
                  first: "{{ first_dev }}"

                night_qualifies:
                  bedroom: true
                  office: "{{ office_dev | abs >= night_threshold }}"
                  living: "{{ living_dev | abs >= night_threshold }}"
                  first: "{{ first_dev | abs >= night_threshold }}"

            # Bedroom auto-dominance rule (comfort protector)
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ bedroom_dev | abs >= 2 }}"
                  sequence:
                    - service: input_text.set_value
                      target:
                        entity_id: input_text.priority_room
                      data:
                        value: "bedroom"
              default:
                - variables:
                    night_candidates: >
                      {% set items = [] %}
                      {% for r,dev in night_devs.items() %}
                        {% if night_qualifies[r] and (dev | abs >= night_threshold) %}
                          {% set _ = items.append((r, dev | abs)) %}
                        {% endif %}
                      {% endfor %}
                      {{ items }}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ night_candidates | length > 0 }}"
                      sequence:
                        - variables:
                            sorted_night: "{{ night_candidates | sort(attribute=1, reverse=True) }}"
                            night_winner: "{{ sorted_night[0][0] }}"
                        - service: input_text.set_value
                          target:
                            entity_id: input_text.priority_room
                          data:
                            value: "{{ night_winner }}"
                  default:
                    - service: input_text.set_value
                      target:
                        entity_id: input_text.priority_room
                      data:
                        value: "none"

        ##################################################################
        # DAY MODE LOGIC (unchanged)
        ##################################################################
        - conditions:
            - condition: template
              value_template: "{{ not is_night }}"
          sequence:

            - variables:
                day_devs:
                  bedroom: "{{ bedroom_dev }}"
                  office: "{{ office_dev }}"
                  living: "{{ living_dev }}"
                  first: "{{ first_dev }}"

            - variables:
                day_candidates: >
                  {% set items = [] %}
                  {% for r,dev in day_devs.items() %}
                    {% if dev | abs >= 2 %}
                      {% set _ = items.append((r, dev | abs)) %}
                    {% endif %}
                  {% endfor %}
                  {{ items }}

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ day_candidates | length > 0 }}"
                  sequence:
                    - variables:
                        sorted_day: "{{ day_candidates | sort(attribute=1, reverse=True) }}"
                        day_winner: "{{ sorted_day[0][0] }}"
                    - service: input_text.set_value
                      target:
                        entity_id: input_text.priority_room
                      data:
                        value: "{{ day_winner }}"
              default:
                - service: input_text.set_value
                  target:
                    entity_id: input_text.priority_room
                  data:
                    value: "none"
