- id: hvac_priority
  alias: HVAC Priority Room Selection
  mode: single
  description: Determine the correct HVAC priority room based on deviation, delay, and ranking.

  trigger:
    - platform: time_pattern
      minutes: "/1"

  variables:
    # Current temps
    bedroom_temp: "{{ states('sensor.temperature_sensor_bedroom_temperature') | float }}"
    office_temp: "{{ states('sensor.temperature_sensor_office_temperature') | float }}"
    living_temp: "{{ states('sensor.temperature_sensor_living_room_temperature') | float }}"
    first_temp: "{{ states('sensor.temperature_sensor_first_floor_temperature') | float }}"

    # Setpoints
    bedroom_sp: "{{ states('input_number.bedroom_setpoint') | float }}"
    office_sp: "{{ states('input_number.office_setpoint') | float }}"
    living_sp: "{{ states('input_number.living_room_setpoint') | float }}"
    first_sp: "{{ states('input_number.first_floor_setpoint') | float }}"

    # Deviations (signed)
    bedroom_dev: "{{ bedroom_temp - bedroom_sp }}"
    office_dev: "{{ office_temp - office_sp }}"
    living_dev: "{{ living_temp - living_sp }}"
    first_dev: "{{ first_temp - first_sp }}"

    # Absolute deviations
    bedroom_abs: "{{ bedroom_dev | abs }}"
    office_abs: "{{ office_dev | abs }}"
    living_abs: "{{ living_dev | abs }}"
    first_abs: "{{ first_dev | abs }}"

    # Deviation threshold
    threshold: 2

    # Delay threshold (minutes)
    delay_min: "{{ states('input_number.target_delay_minutes') | int }}"

    # Booleans: room outside setpoint
    bedroom_out: "{{ bedroom_abs >= threshold }}"
    office_out: "{{ office_abs >= threshold }}"
    living_out: "{{ living_abs >= threshold }}"
    first_out: "{{ first_abs >= threshold }}"

    # Time since last state change (in minutes)
    bedroom_elapsed: "{{ (now() - states.sensor.temperature_sensor_bedroom_temperature.last_changed).seconds / 60 }}"
    office_elapsed: "{{ (now() - states.sensor.temperature_sensor_office_temperature.last_changed).seconds / 60 }}"
    living_elapsed: "{{ (now() - states.sensor.temperature_sensor_living_room_temperature.last_changed).seconds / 60 }}"
    first_elapsed: "{{ (now() - states.sensor.temperature_sensor_first_floor_temperature.last_changed).seconds / 60 }}"

    # Booleans: deviation persisted >= delay
    bedroom_ready: "{{ bedroom_out and (bedroom_elapsed >= delay_min) }}"
    office_ready: "{{ office_out and (office_elapsed >= delay_min) }}"
    living_ready: "{{ living_out and (living_elapsed >= delay_min) }}"
    first_ready: "{{ first_out and (first_elapsed >= delay_min) }}"

    # Priority ranks
    bedroom_rank: "{{ states('input_number.bedroom_priority') | int }}"
    office_rank: "{{ states('input_number.office_priority') | int }}"
    first_rank: "{{ states('input_number.first_floor_priority') | int }}"
    living_rank: "{{ states('input_number.living_room_priority') | int }}"

    # Room eligibility map: room_name → (is_ready, rank, deviation)
    rooms: >
      {{
        {
          'bedroom': (bedroom_ready, bedroom_rank, bedroom_abs),
          'office':  (office_ready,  office_rank,  office_abs),
          'first':   (first_ready,   first_rank,   first_abs),
          'living':  (living_ready,  living_rank,  living_abs)
        }
      }}

    # Final priority room selection
    priority_room: >
      {%- set eligible = rooms.items() | selectattr('1.0') | list -%}
      {%- if eligible | length == 0 -%}
        none
      {%- else -%}
        {{ (eligible | sort(attribute='1.1'))[0][0] }}
      {%- endif -%}

  action:
    - service: input_text.set_value
      target:
        entity_id: input_text.priority_room
      data:
        value: "{{ priority_room }}"
