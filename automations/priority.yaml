- id: hvac_priority
  alias: HVAC Priority Room Selection
  mode: single
  description: Determine the correct HVAC priority room based on deviation, delay, and ranking.

  trigger:
    - platform: time_pattern
      minutes: "/1"

  variables:
    # Deviation threshold (from config or default)
    threshold: "{{ states('input_number.deviation_threshold') | float(2) }}"

    # Delay threshold (minutes)
    delay_min: "{{ states('input_number.deviation_delay_minutes') | float(20) }}"

    # Use template sensors for out-of-setpoint status
    # These track when a room crossed the deviation threshold
    bedroom_out: "{{ states('sensor.bedroom_out_of_setpoint') == 'True' }}"
    office_out: "{{ states('sensor.office_out_of_setpoint') == 'True' }}"
    living_out: "{{ states('sensor.living_room_out_of_setpoint') == 'True' }}"
    first_out: "{{ states('sensor.first_floor_out_of_setpoint') == 'True' }}"

    # Time since room entered deviation zone (in minutes)
    # last_changed tells us when the sensor state last changed
    # We only count elapsed time if the room is currently out of setpoint
    bedroom_elapsed: >
      {% if bedroom_out %}
        {{ (now() - states.sensor.bedroom_out_of_setpoint.last_changed).total_seconds() / 60 }}
      {% else %}
        0
      {% endif %}
    office_elapsed: >
      {% if office_out %}
        {{ (now() - states.sensor.office_out_of_setpoint.last_changed).total_seconds() / 60 }}
      {% else %}
        0
      {% endif %}
    living_elapsed: >
      {% if living_out %}
        {{ (now() - states.sensor.living_room_out_of_setpoint.last_changed).total_seconds() / 60 }}
      {% else %}
        0
      {% endif %}
    first_elapsed: >
      {% if first_out %}
        {{ (now() - states.sensor.first_floor_out_of_setpoint.last_changed).total_seconds() / 60 }}
      {% else %}
        0
      {% endif %}

    # Booleans: deviation persisted >= delay
    bedroom_ready: "{{ bedroom_out and (bedroom_elapsed >= delay_min) }}"
    office_ready: "{{ office_out and (office_elapsed >= delay_min) }}"
    living_ready: "{{ living_out and (living_elapsed >= delay_min) }}"
    first_ready: "{{ first_out and (first_elapsed >= delay_min) }}"

    # Absolute deviations (for tiebreaking if needed)
    bedroom_abs: "{{ states('sensor.bedroom_temperature_deviation') | float | abs }}"
    office_abs: "{{ states('sensor.office_temperature_deviation') | float | abs }}"
    living_abs: "{{ states('sensor.living_room_temperature_deviation') | float | abs }}"
    first_abs: "{{ states('sensor.first_floor_temperature_deviation') | float | abs }}"

    # Priority ranks
    bedroom_rank: "{{ states('input_number.bedroom_priority') | int }}"
    office_rank: "{{ states('input_number.office_priority') | int }}"
    living_rank: "{{ states('input_number.living_room_priority') | int }}"
    first_rank: "{{ states('input_number.first_floor_priority') | int }}"

    # Room eligibility map: room_name → (is_ready, rank, deviation)
    rooms: >
      {{
        {
          'bedroom': (bedroom_ready, bedroom_rank, bedroom_abs),
          'office':  (office_ready,  office_rank,  office_abs),
          'first':   (first_ready,   first_rank,   first_abs),
          'living':  (living_ready,  living_rank,  living_abs)
        }
      }}

    # Final priority room selection: lowest rank among eligible rooms
    priority_room: >
      {%- set eligible = rooms.items() | selectattr('1.0') | list -%}
      {%- if eligible | length == 0 -%}
        none
      {%- else -%}
        {{ (eligible | sort(attribute='1.1'))[0][0] }}
      {%- endif -%}

  action:
    - service: input_text.set_value
      target:
        entity_id: input_text.priority_room
      data:
        value: "{{ priority_room }}"
