# =============================================================================
# HVAC Logic Test Runner
# =============================================================================
# This automation runs through all test scenarios to validate HVAC logic.
# Trigger manually from Developer Tools or the dashboard.
#
# Tests run in sequence, each completing in milliseconds.
# Results are tracked in input_text/input_number helpers for dashboard display.
# =============================================================================

# -----------------------------------------------------------------------------
# Main Test Runner - Orchestrates all tests
# -----------------------------------------------------------------------------
- id: hvac_test_runner
  alias: "HVAC Test Runner"
  description: "Run all HVAC logic tests"
  mode: single

  trigger:
    - platform: state
      entity_id: input_boolean.hvac_test_mode
      to: "on"
      id: manual_trigger

  action:
    # -------------------------------------------------------------------------
    # Initialize test environment
    # -------------------------------------------------------------------------
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.hvac_test_running

    - service: input_number.set_value
      target:
        entity_id: input_number.test_current_index
      data:
        value: 0

    - service: input_number.set_value
      target:
        entity_id: input_number.test_passed_count
      data:
        value: 0

    - service: input_number.set_value
      target:
        entity_id: input_number.test_failed_count
      data:
        value: 0

    - service: input_text.set_value
      target:
        entity_id: input_text.test_failed_list
      data:
        value: ""

    # Set default setpoints for consistent testing
    - service: input_number.set_value
      target:
        entity_id: input_number.bedroom_setpoint
      data:
        value: 65

    - service: input_number.set_value
      target:
        entity_id: input_number.office_setpoint
      data:
        value: 68

    - service: input_number.set_value
      target:
        entity_id: input_number.living_room_setpoint
      data:
        value: 68

    - service: input_number.set_value
      target:
        entity_id: input_number.first_floor_setpoint
      data:
        value: 68

    # Set default priorities (bedroom=1, office=2, first=3, living=4)
    - service: input_number.set_value
      target:
        entity_id: input_number.bedroom_priority
      data:
        value: 1

    - service: input_number.set_value
      target:
        entity_id: input_number.office_priority
      data:
        value: 2

    - service: input_number.set_value
      target:
        entity_id: input_number.first_floor_priority
      data:
        value: 3

    - service: input_number.set_value
      target:
        entity_id: input_number.living_room_priority
      data:
        value: 4

    # Set default thresholds
    - service: input_number.set_value
      target:
        entity_id: input_number.deviation_threshold
      data:
        value: 2

    - service: input_number.set_value
      target:
        entity_id: input_number.night_non_priority_threshold
      data:
        value: 5

    # Set day mode time for testing (noon)
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.test_simulated_time
      data:
        time: "12:00:00"

    # Turn off guest override
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.guest_override

    # Brief delay to let templates update
    - delay:
        milliseconds: 100

    # -------------------------------------------------------------------------
    # TEST 1: No room needs conditioning - priority should be "none"
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "1: No conditioning needed"

    # All rooms at setpoint
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 65

    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 68

    - service: input_number.set_value
      target:
        entity_id: input_number.test_living_room_temperature
      data:
        value: 68

    - service: input_number.set_value
      target:
        entity_id: input_number.test_first_floor_temperature
      data:
        value: 68

    - delay:
        milliseconds: 50

    # Check result: all rooms should show "none" for target direction
    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'none' and
               states('sensor.test_office_target_direction') == 'none' and
               states('sensor.test_living_room_target_direction') == 'none' and
               states('sensor.test_first_floor_target_direction') == 'none' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}1: No conditioning needed; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 2: Bedroom needs heating (below setpoint by threshold)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "2: Bedroom needs heating"

    # Bedroom at 62°F (setpoint 65, deviation -3)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 62

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'heat' and
               states('sensor.test_bedroom_out_of_setpoint') == 'True' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}2: Bedroom heating; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 3: Bedroom needs cooling (above setpoint by threshold)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "3: Bedroom needs cooling"

    # Bedroom at 68°F (setpoint 65, deviation +3)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 68

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'cool' and
               states('sensor.test_bedroom_out_of_setpoint') == 'True' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}3: Bedroom cooling; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 4: Office needs cooling during daytime
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "4: Office cooling (daytime)"

    # Reset bedroom, set office hot
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 65

    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 72

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_office_target_direction') == 'cool' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_office_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}4: Office daytime cooling; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 5: Night mode - Office at +4°F should NOT qualify for priority (threshold is 5°F)
    # -------------------------------------------------------------------------
    # Note: target_direction will be 'cool' (room wants to cool), but out_of_setpoint
    # is False so room won't become priority.
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "5: Night mode - Office +4F no priority"

    # Set night time (11 PM)
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.test_simulated_time
      data:
        time: "23:00:00"

    # Office at 72°F (setpoint 68, deviation +4, but night threshold is 5)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 72

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_office_out_of_setpoint') == 'False' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - out: {{ states('sensor.test_office_out_of_setpoint') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}5: Night office +4F; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 6: Night mode - Office at +6°F SHOULD qualify (above 5°F threshold)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "6: Night mode - Office +6F qualifies"

    # Office at 74°F (setpoint 68, deviation +6, above night threshold 5)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 74

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_office_target_direction') == 'cool' and
               states('sensor.test_office_out_of_setpoint') == 'True' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - direction: {{ states('sensor.test_office_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}6: Night office +6F; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 7: Night mode - Bedroom still uses 2°F threshold
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "7: Night mode - Bedroom 2F threshold"

    # Bedroom at 62°F (setpoint 65, deviation -3, should still qualify at night)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 62

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'heat' and
               states('sensor.test_bedroom_out_of_setpoint') == 'True' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}7: Night bedroom 2F; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 8: Deviation just below threshold - should NOT qualify for priority
    # -------------------------------------------------------------------------
    # Note: target_direction will be 'heat' (room wants to heat), but out_of_setpoint
    # is False so room won't become priority. However, if condenser is in heat mode,
    # the room WILL get active heating (via *_needs logic).
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "8: Below threshold - no priority"

    # Reset to day mode
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.test_simulated_time
      data:
        time: "12:00:00"

    # Bedroom at 63.5°F (setpoint 65, deviation -1.5, below 2°F threshold)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 63.5

    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 68

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_out_of_setpoint') == 'False' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - out: {{ states('sensor.test_bedroom_out_of_setpoint') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}8: Below threshold; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 9: Deviation exactly at threshold - should qualify
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "9: Exactly at threshold - qualifies"

    # Bedroom at 63°F (setpoint 65, deviation -2, exactly at threshold)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 63

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'heat' and
               states('sensor.test_bedroom_out_of_setpoint') == 'True' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - dev: {{ states('sensor.test_bedroom_deviation') }}, dir: {{ states('sensor.test_bedroom_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}9: At threshold; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 10: Multiple rooms need same direction - all should show it
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "10: Multiple rooms need cooling"

    # All rooms too hot
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 70

    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 73

    - service: input_number.set_value
      target:
        entity_id: input_number.test_living_room_temperature
      data:
        value: 72

    - service: input_number.set_value
      target:
        entity_id: input_number.test_first_floor_temperature
      data:
        value: 71

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'cool' and
               states('sensor.test_office_target_direction') == 'cool' and
               states('sensor.test_living_room_target_direction') == 'cool' and
               states('sensor.test_first_floor_target_direction') == 'cool' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}10: Multi-room cooling; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 11: Conflicting room needs - verify directions are independent
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "11: Conflicting room needs"

    # Bedroom cold, office hot
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 62

    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 73

    - service: input_number.set_value
      target:
        entity_id: input_number.test_living_room_temperature
      data:
        value: 68

    - service: input_number.set_value
      target:
        entity_id: input_number.test_first_floor_temperature
      data:
        value: 68

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_target_direction') == 'heat' and
               states('sensor.test_office_target_direction') == 'cool' and
               states('sensor.test_living_room_target_direction') == 'none' and
               states('sensor.test_first_floor_target_direction') == 'none' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - bed: {{ states('sensor.test_bedroom_target_direction') }}, off: {{ states('sensor.test_office_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}11: Conflicting needs; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 12: First floor heating
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "12: First floor heating"

    # Reset others, first floor cold
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 65

    - service: input_number.set_value
      target:
        entity_id: input_number.test_office_temperature
      data:
        value: 68

