      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_fan_speed') }}, dev: {{ states('sensor.test_bedroom_deviation') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}13: Fan HIGH; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 14: Fan speed MEDIUM (deviation > 1.5°F, <= 3°F)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "14: Fan speed MEDIUM (1.5-3F deviation)"

    # Bedroom at 67.5°F (setpoint 65, deviation +2.5, should be MEDIUM)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 67.5

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_fan_speed') == 'medium' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_fan_speed') }}, dev: {{ states('sensor.test_bedroom_deviation') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}14: Fan MEDIUM; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 15: Fan speed LOW (deviation > 0.5°F, <= 1.5°F)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "15: Fan speed LOW (0.5-1.5F deviation)"

    # Set condenser to heat mode for this test
    - service: input_text.set_value
      target:
        entity_id: input_text.condenser_mode_request
      data:
        value: "heat"

    # Bedroom at 63°F (setpoint 65, deviation -2, needs heating)
    # But for fan speed test we need deviation between 0.5 and 1.5 while still needing conditioning
    # Actually the fan speed is based on absolute deviation, not need
    # Let's set bedroom at 63.8°F (deviation -1.2) but since threshold is 2, it doesn't need conditioning
    # So let's use a room that needs conditioning: bedroom at 62°F (dev -3) for heat mode
    # Actually, re-reading the logic: fan speed is only calculated if room needs conditioning
    # If room needs heat: dev <= -threshold (-2), so bedroom at 63.9 (dev -1.1) won't need heat
    # So for LOW fan test with heat mode: need dev <= -2 AND 0.5 < |dev| <= 1.5
    # That's impossible since if dev <= -2, |dev| >= 2
    # The LOW fan speed only applies when |dev| is between 0.5 and 1.5 AND room needs conditioning
    # With threshold of 2, that can't happen
    # Looking at the original head_units.yaml: it checks bedroom_needs first (threshold-based)
    # Then if needs, it applies fan speed based on deviation magnitude
    # So if threshold is 2, you can only "need" conditioning when |dev| >= 2
    # Therefore LOW can only happen when 2 <= |dev| <= 1.5 which is never true!
    # Wait, re-reading: low is for 0.5 < |dev| <= 1.5, but you can only need when |dev| >= 2
    # So the LOW state for "needing" rooms is actually impossible with default threshold
    # LOW only happens for rooms NOT needing conditioning (circulation mode)

    # Let me verify: if bedroom_needs is false, fan = low (circulation)
    # if bedroom_needs is true and |dev| > 3: high
    # if bedroom_needs is true and |dev| > 1.5: medium
    # if bedroom_needs is true and |dev| > 0.5: low
    # if bedroom_needs is true and |dev| <= 0.5: auto

    # So with threshold=2, if needs=true, |dev| >= 2, so we can hit:
    # - high (|dev| > 3, e.g., dev=3.5)
    # - medium (1.5 < |dev| <= 3, e.g., dev=2.5)
    # But NOT low (0.5 < |dev| <= 1.5) or auto (|dev| <= 0.5) when needing

    # For this test, let's test the circulation case: room NOT needing conditioning = LOW
    # Bedroom at 65°F (at setpoint, no need) should be LOW for circulation
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 65

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_fan_speed') == 'low' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_fan_speed') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}15: Fan LOW circulation; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 16: Fan speed LOW for non-conditioning room (opposite mode)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "16: Fan LOW - room needs opposite mode"

    # Condenser in heat mode, but bedroom is HOT (needs cool, not heat)
    # So bedroom should NOT get active conditioning, just circulation (LOW)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 70

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_fan_speed') == 'low' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_fan_speed') }}, mode: heat, dev: {{ states('sensor.test_bedroom_deviation') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}16: Fan LOW opposite; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 17: Fan speed HIGH for heating (deviation < -3°F)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "17: Fan HIGH for heating"

    # Bedroom at 60°F (setpoint 65, deviation -5, needs heat, should be HIGH)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 60

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_fan_speed') == 'high' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_fan_speed') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}17: Fan HIGH heat; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 18: Fan speed MEDIUM for heating (deviation between -1.5 and -3°F)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "18: Fan MEDIUM for heating"

    # Bedroom at 62.5°F (setpoint 65, deviation -2.5, needs heat, should be MEDIUM)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 62.5

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_fan_speed') == 'medium' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_bedroom_fan_speed') }}, dev: {{ states('sensor.test_bedroom_deviation') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}18: Fan MEDIUM heat; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 19: First floor fan HIGH when being conditioned (600 sq ft override)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "19: First floor fan HIGH when conditioned"

    # Set condenser to heat mode
    - service: input_text.set_value
      target:
        entity_id: input_text.condenser_mode_request
      data:
        value: "heat"

    # First floor at 65.5°F (setpoint 68, deviation -2.5°F)
    # Other rooms would be MEDIUM at this deviation, but first floor is always HIGH
    - service: input_number.set_value
      target:
        entity_id: input_number.test_first_floor_temperature
      data:
        value: 65.5

    - delay:
        milliseconds: 50

    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_first_floor_fan_speed') == 'high' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - Got: {{ states('sensor.test_first_floor_fan_speed') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}19: First floor fan priority; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 20: Continue cooling below threshold (oscillation prevention)
    # -------------------------------------------------------------------------
    # This is the exact scenario that caused the overnight oscillation bug:
    # Room triggers cooling at threshold, drops below threshold but hasn't
    # reached setpoint. Should CONTINUE cooling, not stop.
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "20: Continue cooling below threshold"

    # Set condenser to cool mode
    - service: input_text.set_value
      target:
        entity_id: input_text.condenser_mode_request
      data:
        value: "cool"

    # First, trigger the threshold by setting bedroom hot (+3°F)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 68

    - delay:
        milliseconds: 50

    # Verify out_of_setpoint is True (this is the memory that we triggered)
    # Then drop below threshold but still above setpoint
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 66.5

    - delay:
        milliseconds: 50

    # Bedroom at 66.5°F (setpoint 65, deviation +1.5, below 2°F threshold)
    # Room should still need cooling because dev > 0 (still above setpoint)
    # Note: out_of_setpoint will be False (threshold-based), but needs/direction should be True/cool
    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_needs') == 'True' and
               states('sensor.test_bedroom_target_direction') == 'cool' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - needs: {{ states('sensor.test_bedroom_needs') }}, dir: {{ states('sensor.test_bedroom_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}20: Continue below threshold; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 21: Stop cooling when setpoint reached (deviation = 0)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "21: Stop at setpoint"

    # Continue from test 20 - room was cooling, now reaches setpoint
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 65

    - delay:
        milliseconds: 50

    # At setpoint (deviation = 0), should stop needing conditioning
    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_out_of_setpoint') == 'False' and
               states('sensor.test_bedroom_needs') == 'False' and
               states('sensor.test_bedroom_target_direction') == 'none' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - out: {{ states('sensor.test_bedroom_out_of_setpoint') }}, needs: {{ states('sensor.test_bedroom_needs') }}, dir: {{ states('sensor.test_bedroom_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}21: Stop at setpoint; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # TEST 22: Continue heating below threshold (heat mode equivalent)
    # -------------------------------------------------------------------------
    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "22: Continue heating below threshold"

    # Set condenser to heat mode
    - service: input_text.set_value
      target:
        entity_id: input_text.condenser_mode_request
      data:
        value: "heat"

    # First, trigger the threshold by setting bedroom cold (-3°F)
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 62

    - delay:
        milliseconds: 50

    # Now warm up to below threshold but still below setpoint
    - service: input_number.set_value
      target:
        entity_id: input_number.test_bedroom_temperature
      data:
        value: 63.5

    - delay:
        milliseconds: 50

    # Bedroom at 63.5°F (setpoint 65, deviation -1.5, below 2°F threshold)
    # Room should still need heating because dev < 0 (still below setpoint)
    # Note: out_of_setpoint will be False (threshold-based), but needs/direction should be True/heat
    - if:
        - condition: template
          value_template: >
            {{ states('sensor.test_bedroom_needs') == 'True' and
               states('sensor.test_bedroom_target_direction') == 'heat' }}
      then:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "PASSED"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_passed_count
          data:
            value: "{{ states('input_number.test_passed_count') | int + 1 }}"
      else:
        - service: input_text.set_value
          target:
            entity_id: input_text.test_current_status
          data:
            value: "FAILED - needs: {{ states('sensor.test_bedroom_needs') }}, dir: {{ states('sensor.test_bedroom_target_direction') }}"
        - service: input_number.set_value
          target:
            entity_id: input_number.test_failed_count
          data:
            value: "{{ states('input_number.test_failed_count') | int + 1 }}"
        - service: input_text.set_value
          target:
            entity_id: input_text.test_failed_list
          data:
            value: "{{ states('input_text.test_failed_list') }}22: Continue heat below threshold; "

    - delay:
        milliseconds: 50

    # -------------------------------------------------------------------------
    # Finalize test run
    # -------------------------------------------------------------------------
    - service: input_number.set_value
      target:
        entity_id: input_number.test_total_count
      data:
        value: 22

    - service: input_text.set_value
      target:
        entity_id: input_text.test_current_name
      data:
        value: "Complete"

    - service: input_text.set_value
      target:
        entity_id: input_text.test_last_run_result
      data:
        value: >
          {{ states('input_number.test_passed_count') | int }}/22 passed
          {% if states('input_number.test_failed_count') | int > 0 %}
          - FAILED: {{ states('input_text.test_failed_list') }}
          {% endif %}

    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hvac_test_running

    # Send notification with results
    - service: persistent_notification.create
      data:
        title: "HVAC Logic Tests Complete"
        message: >
          Results: {{ states('input_number.test_passed_count') | int }}/22 tests passed

          {% if states('input_number.test_failed_count') | int > 0 %}
          Failed tests: {{ states('input_text.test_failed_list') }}
          {% else %}
          All tests passed!
          {% endif %}
        notification_id: hvac_test_results

    # Turn off test mode
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.hvac_test_mode
