- id: hvac_head_units_control
  alias: HVAC Head Units Control
  mode: restart
  description: Per room control based on global mode and room needs (with bias helpers)

  trigger:
    - platform: state
      entity_id: input_text.condenser_mode_request
    - platform: state
      entity_id:
        - sensor.temperature_sensor_bedroom_temperature
        - sensor.temperature_sensor_office_temperature
        - sensor.temperature_sensor_living_room_temperature
        - sensor.temperature_sensor_first_floor_temperature
        - input_number.bedroom_setpoint
        - input_number.office_setpoint
        - input_number.living_room_setpoint
        - input_number.first_floor_setpoint
        - input_number.living_room_bias
        - input_number.first_floor_bias

  variables:
    mode_request: "{{ states('input_text.condenser_mode_request') }}"

    threshold: 2

    neutral_heat_temp: 60
    neutral_cool_temp: 80

    bedroom_temp: "{{ states('sensor.temperature_sensor_bedroom_temperature') | float }}"
    office_temp: "{{ states('sensor.temperature_sensor_office_temperature') | float }}"
    living_temp: "{{ states('sensor.temperature_sensor_living_room_temperature') | float }}"
    first_temp: "{{ states('sensor.temperature_sensor_first_floor_temperature') | float }}"

    bedroom_sp: "{{ states('input_number.bedroom_setpoint') | float }}"
    office_sp: "{{ states('input_number.office_setpoint') | float }}"
    living_sp: "{{ states('input_number.living_room_setpoint') | float }}"
    first_sp: "{{ states('input_number.first_floor_setpoint') | float }}"

    living_bias: "{{ states('input_number.living_room_bias') | float }}"
    first_bias: "{{ states('input_number.first_floor_bias') | float }}"

    bedroom_dev: "{{ bedroom_temp - bedroom_sp }}"
    office_dev: "{{ office_temp - office_sp }}"
    living_dev: "{{ living_temp - living_sp }}"
    first_dev: "{{ first_temp - first_sp }}"

    bedroom_need: >
      {% if bedroom_dev < -threshold %}heat
      {% elif bedroom_dev > threshold %}cool
      {% else %}none
      {% endif %}
    office_need: >
      {% if office_dev < -threshold %}heat
      {% elif office_dev > threshold %}cool
      {% else %}none
      {% endif %}
    living_need: >
      {% if living_dev < -threshold %}heat
      {% elif living_dev > threshold %}cool
      {% else %}none
      {% endif %}
    first_need: >
      {% if first_dev < -threshold %}heat
      {% elif first_dev > threshold %}cool
      {% else %}none
      {% endif %}

  action:
    - choose:

        ######################################################################
        # GLOBAL HEAT
        ######################################################################
        - conditions:
            - condition: template
              value_template: "{{ mode_request == 'heat' }}"
          sequence:

            # BEDROOM (bias = 0)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.bedroom_air }
              data: { hvac_mode: heat }

            - service: climate.set_temperature
              target: { entity_id: climate.bedroom_air }
              data:
                temperature: >
                  {% if bedroom_need == 'heat' %}
                    {{ bedroom_sp | round(0) | int }}
                  {% else %}
                    {{ neutral_heat_temp }}
                  {% endif %}
                hvac_mode: heat

            - service: climate.set_fan_mode
              target: { entity_id: climate.bedroom_air }
              data:
                fan_mode: >
                  {% if bedroom_need != 'heat' %}
                    low
                  {% else %}
                    {% set a = bedroom_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

            # OFFICE (bias = 0)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.office_air }
              data: { hvac_mode: heat }

            - service: climate.set_temperature
              target: { entity_id: climate.office_air }
              data:
                temperature: >
                  {% if office_need == 'heat' %}
                    {{ office_sp | round(0) | int }}
                  {% else %}
                    {{ neutral_heat_temp }}
                  {% endif %}
                hvac_mode: heat

            - service: climate.set_fan_mode
              target: { entity_id: climate.office_air }
              data:
                fan_mode: >
                  {% if office_need != 'heat' %}
                    low
                  {% else %}
                    {% set a = office_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

            # LIVING ROOM (bias = +living_bias)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.living_room_air }
              data: { hvac_mode: heat }

            - service: climate.set_temperature
              target: { entity_id: climate.living_room_air }
              data:
                temperature: >
                  {% if living_need == 'heat' %}
                    {{ (living_sp + living_bias) | round(0) | int }}
                  {% else %}
                    {{ neutral_heat_temp }}
                  {% endif %}
                hvac_mode: heat

            - service: climate.set_fan_mode
              target: { entity_id: climate.living_room_air }
              data:
                fan_mode: >
                  {% if living_need != 'heat' %}
                    low
                  {% else %}
                    {% set a = living_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

            # FIRST FLOOR (bias = +first_bias)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.shop_air }
              data: { hvac_mode: heat }

            - service: climate.set_temperature
              target: { entity_id: climate.shop_air }
              data:
                temperature: >
                  {% if first_need == 'heat' %}
                    {{ (first_sp + first_bias) | round(0) | int }}
                  {% else %}
                    {{ neutral_heat_temp }}
                  {% endif %}
                hvac_mode: heat

            - service: climate.set_fan_mode
              target: { entity_id: climate.shop_air }
              data:
                fan_mode: >
                  {% if first_need != 'heat' %}
                    low
                  {% else %}
                    {% set a = first_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

        ######################################################################
        # GLOBAL COOL
        ######################################################################
        - conditions:
            - condition: template
              value_template: "{{ mode_request == 'cool' }}"
          sequence:

            # BEDROOM (bias = 0)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.bedroom_air }
              data: { hvac_mode: cool }

            - service: climate.set_temperature
              target: { entity_id: climate.bedroom_air }
              data:
                temperature: >
                  {% if bedroom_need == 'cool' %}
                    {{ bedroom_sp | round(0) | int }}
                  {% else %}
                    {{ neutral_cool_temp }}
                  {% endif %}
                hvac_mode: cool

            - service: climate.set_fan_mode
              target: { entity_id: climate.bedroom_air }
              data:
                fan_mode: >
                  {% if bedroom_need != 'cool' %}
                    low
                  {% else %}
                    {% set a = bedroom_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

            # OFFICE (bias = 0)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.office_air }
              data: { hvac_mode: cool }

            - service: climate.set_temperature
              target: { entity_id: climate.office_air }
              data:
                temperature: >
                  {% if office_need == 'cool' %}
                    {{ office_sp | round(0) | int }}
                  {% else %}
                    {{ neutral_cool_temp }}
                  {% endif %}
                hvac_mode: cool

            - service: climate.set_fan_mode
              target: { entity_id: climate.office_air }
              data:
                fan_mode: >
                  {% if office_need != 'cool' %}
                    low
                  {% else %}
                    {% set a = office_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

            # LIVING ROOM (bias = +living_bias)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.living_room_air }
              data: { hvac_mode: cool }

            - service: climate.set_temperature
              target: { entity_id: climate.living_room_air }
              data:
                temperature: >
                  {% if living_need == 'cool' %}
                    {{ (living_sp + living_bias) | round(0) | int }}
                  {% else %}
                    {{ neutral_cool_temp }}
                  {% endif %}
                hvac_mode: cool

            - service: climate.set_fan_mode
              target: { entity_id: climate.living_room_air }
              data:
                fan_mode: >
                  {% if living_need != 'cool' %}
                    low
                  {% else %}
                    {% set a = living_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

            # FIRST FLOOR (bias = +first_bias)
            - service: climate.set_hvac_mode
              target: { entity_id: climate.shop_air }
              data: { hvac_mode: cool }

            - service: climate.set_temperature
              target: { entity_id: climate.shop_air }
              data:
                temperature: >
                  {% if first_need == 'cool' %}
                    {{ (first_sp + first_bias) | round(0) | int }}
                  {% else %}
                    {{ neutral_cool_temp }}
                  {% endif %}
                hvac_mode: cool

            - service: climate.set_fan_mode
              target: { entity_id: climate.shop_air }
              data:
                fan_mode: >
                  {% if first_need != 'cool' %}
                    low
                  {% else %}
                    {% set a = first_dev | abs %}
                    {% if a > 3 %}high
                    {% elif a > 1.5 %}medium
                    {% elif a > 0.5 %}low
                    {% else %}auto
                    {% endif %}
                  {% endif %}

      default: []
