- id: hvac_head_units_control
  alias: HVAC Head Units Control
  mode: restart
  description: Control each head unit based on condenser mode and room deviation

  trigger:
    - platform: state
      entity_id: input_text.condenser_mode_request
    - platform: state
      entity_id:
        - sensor.bedroom_temperature_deviation
        - sensor.office_temperature_deviation
        - sensor.living_room_temperature_deviation
        - sensor.first_floor_temperature_deviation
        - input_number.bedroom_setpoint
        - input_number.office_setpoint
        - input_number.living_room_setpoint
        - input_number.first_floor_setpoint

  variables:
    # Current condenser mode
    mode: "{{ states('input_text.condenser_mode_request') }}"

    # Neutral temperatures (head unit target when room doesn't need conditioning)
    neutral_temp: "{{ 60 if mode == 'heat' else 80 }}"

    # Deviation threshold
    threshold: "{{ states('input_number.deviation_threshold') | float(2) }}"

    # Room setpoints
    bedroom_sp: "{{ states('input_number.bedroom_setpoint') | float | round(0) | int }}"
    office_sp: "{{ states('input_number.office_setpoint') | float | round(0) | int }}"
    living_sp: "{{ states('input_number.living_room_setpoint') | float | round(0) | int }}"
    first_sp: "{{ states('input_number.first_floor_setpoint') | float | round(0) | int }}"

    # First floor sensor offset - compensates for Mitsubishi's built-in sensor
    # reading warmer than actual room temp (sensor is near ceiling/unit)
    first_floor_offset: "{{ states('input_number.first_floor_temp_offset') | float(3) }}"

    # Room deviations (from template sensors)
    bedroom_dev: "{{ states('sensor.bedroom_temperature_deviation') | float }}"
    office_dev: "{{ states('sensor.office_temperature_deviation') | float }}"
    living_dev: "{{ states('sensor.living_room_temperature_deviation') | float }}"
    first_dev: "{{ states('sensor.first_floor_temperature_deviation') | float }}"

    # Room needs conditioning? (matches condenser mode direction)
    bedroom_needs: "{{ (mode == 'heat' and bedroom_dev <= -threshold) or (mode == 'cool' and bedroom_dev >= threshold) }}"
    office_needs: "{{ (mode == 'heat' and office_dev <= -threshold) or (mode == 'cool' and office_dev >= threshold) }}"
    living_needs: "{{ (mode == 'heat' and living_dev <= -threshold) or (mode == 'cool' and living_dev >= threshold) }}"
    first_needs: "{{ (mode == 'heat' and first_dev <= -threshold) or (mode == 'cool' and first_dev >= threshold) }}"

    # Target temperatures
    bedroom_target: "{{ bedroom_sp if bedroom_needs else neutral_temp }}"
    office_target: "{{ office_sp if office_needs else neutral_temp }}"
    living_target: "{{ living_sp if living_needs else neutral_temp }}"
    # First floor: apply offset to compensate for Mitsubishi sensor placement
    # Heat mode: tell unit to heat higher (sp + offset) so it runs longer
    # Cool mode: tell unit to cool lower (sp - offset) so it runs longer
    first_target: >
      {% if not first_needs %}
        {{ neutral_temp }}
      {% elif mode == 'heat' %}
        {{ first_sp + first_floor_offset }}
      {% else %}
        {{ first_sp - first_floor_offset }}
      {% endif %}

    # Fan speeds based on deviation magnitude
    # > 3°F = high, 1.5-3°F = medium, ≤ 1.5°F = low
    # Rooms not needing conditioning run on low for circulation
    bedroom_fan: >
      {% if not bedroom_needs %}low
      {% elif bedroom_dev | abs > 3 %}high
      {% elif bedroom_dev | abs > 1.5 %}medium
      {% else %}low
      {% endif %}
    office_fan: >
      {% if not office_needs %}low
      {% elif office_dev | abs > 3 %}high
      {% elif office_dev | abs > 1.5 %}medium
      {% else %}low
      {% endif %}
    living_fan: >
      {% if not living_needs %}low
      {% elif living_dev | abs > 3 %}high
      {% elif living_dev | abs > 1.5 %}medium
      {% else %}low
      {% endif %}
    # First floor is 600 sq ft - always run high when being conditioned
    first_fan: "{{ 'high' if first_needs else 'low' }}"

  condition:
    - condition: template
      value_template: "{{ mode in ['heat', 'cool'] }}"

  action:
    # Bedroom
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.bedroom_air
      data:
        hvac_mode: "{{ mode }}"
    - service: climate.set_temperature
      target:
        entity_id: climate.bedroom_air
      data:
        temperature: "{{ bedroom_target }}"
        hvac_mode: "{{ mode }}"
    - service: climate.set_fan_mode
      target:
        entity_id: climate.bedroom_air
      data:
        fan_mode: "{{ bedroom_fan }}"

    # Office
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.office_air
      data:
        hvac_mode: "{{ mode }}"
    - service: climate.set_temperature
      target:
        entity_id: climate.office_air
      data:
        temperature: "{{ office_target }}"
        hvac_mode: "{{ mode }}"
    - service: climate.set_fan_mode
      target:
        entity_id: climate.office_air
      data:
        fan_mode: "{{ office_fan }}"

    # Living Room
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.living_room_air
      data:
        hvac_mode: "{{ mode }}"
    - service: climate.set_temperature
      target:
        entity_id: climate.living_room_air
      data:
        temperature: "{{ living_target }}"
        hvac_mode: "{{ mode }}"
    - service: climate.set_fan_mode
      target:
        entity_id: climate.living_room_air
      data:
        fan_mode: "{{ living_fan }}"

    # First Floor (Shop)
    - service: climate.set_hvac_mode
      target:
        entity_id: climate.shop_air
      data:
        hvac_mode: "{{ mode }}"
    - service: climate.set_temperature
      target:
        entity_id: climate.shop_air
      data:
        temperature: "{{ first_target }}"
        hvac_mode: "{{ mode }}"
    - service: climate.set_fan_mode
      target:
        entity_id: climate.shop_air
      data:
        fan_mode: "{{ first_fan }}"
