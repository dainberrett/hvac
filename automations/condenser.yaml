- id: hvac_condenser_mode
  alias: HVAC Condenser Mode Selection
  mode: restart
  description: Set condenser mode based on priority room's need, with minimum runtime protection.

  trigger:
    - platform: time_pattern
      minutes: "/1"

  variables:
    # Get priority room
    priority_room: "{{ states('input_text.priority_room') }}"

    # Get priority room's target direction (heat, cool, or none)
    priority_direction: >
      {% if priority_room == 'bedroom' %}
        {{ states('sensor.bedroom_target_direction') }}
      {% elif priority_room == 'office' %}
        {{ states('sensor.office_target_direction') }}
      {% elif priority_room == 'living' %}
        {{ states('sensor.living_room_target_direction') }}
      {% elif priority_room == 'first' %}
        {{ states('sensor.first_floor_target_direction') }}
      {% else %}
        none
      {% endif %}

    # Current condenser mode
    current_mode: >
      {% set cm = states('input_text.condenser_mode_request') %}
      {% if cm in ['heat', 'cool'] %}
        {{ cm }}
      {% else %}
        heat
      {% endif %}

    # Minutes since last mode change
    minutes_since_change: >
      {{ ((as_timestamp(now()) - as_timestamp(states.input_text.condenser_mode_request.last_changed)) / 60) | round(1) }}

    # Minimum runtime before mode switch allowed (default 45 minutes)
    minimum_runtime: "{{ states('input_number.minimum_runtime_minutes') | float(45) }}"

    # Can we switch modes?
    runtime_elapsed: "{{ minutes_since_change >= minimum_runtime }}"

    # Determine new mode
    new_mode: >
      {% if priority_room == 'none' or priority_direction == 'none' %}
        {{ current_mode }}
      {% elif priority_direction == current_mode %}
        {{ current_mode }}
      {% elif runtime_elapsed %}
        {{ priority_direction }}
      {% else %}
        {{ current_mode }}
      {% endif %}

  action:
    - service: input_text.set_value
      target:
        entity_id: input_text.condenser_mode_request
      data:
        value: "{{ new_mode }}"
