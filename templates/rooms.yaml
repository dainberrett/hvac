template:

  # ==========================================================
  # Bedroom
  # ==========================================================

  - sensor:
      - name: bedroom_temperature_deviation
        state: >
          {{ states('sensor.temperature_sensor_bedroom_temperature') | float -
             states('input_number.bedroom_setpoint') | float }}

      - name: bedroom_out_of_setpoint
        state: >
          {% set temp = states('sensor.temperature_sensor_bedroom_temperature') | float %}
          {% set setpoint = states('input_number.bedroom_setpoint') | float %}
          {% set db = states('input_number.deadband') | float %}
          {{ temp > setpoint + db or temp < setpoint - db }}

      - name: bedroom_target_direction
        state: >
          {% set temp = states('sensor.temperature_sensor_bedroom_temperature') | float %}
          {% set setpoint = states('input_number.bedroom_setpoint') | float %}
          {% set db = states('input_number.deadband') | float %}
          {% if temp > setpoint + db %}cool
          {% elif temp < setpoint - db %}heat
          {% else %}none
          {% endif %}

