# ==========================================================
# HVAC Room Template Sensors
# ==========================================================
# Included via configuration.yaml:
#   template:
#     - !include templates/hvac/rooms.yaml
# ==========================================================

binary_sensor:
  # ==========================================================
  # Night Mode Helper
  # ==========================================================
  - name: hvac_night_mode
    state: >
      {% set start = states('input_datetime.night_mode_start') %}
      {% set end = states('input_datetime.night_mode_end') %}
      {% set now_time = now().strftime('%H:%M:%S') %}
      {% if start > end %}
        {{ now_time >= start or now_time < end }}
      {% else %}
        {{ now_time >= start and now_time < end }}
      {% endif %}

sensor:
  # ==========================================================
  # Bedroom
  # ==========================================================
  - name: bedroom_temperature_deviation
    unit_of_measurement: "°F"
    state: >
      {{ (states('sensor.temperature_sensor_bedroom_temperature') | float -
         states('input_number.bedroom_setpoint') | float) | round(1) }}

  - name: bedroom_out_of_setpoint
    state: >
      {% set dev = states('sensor.bedroom_temperature_deviation') | float %}
      {% set threshold = states('input_number.deviation_threshold') | float(2) %}
      {{ dev | abs >= threshold }}

  - name: bedroom_target_direction
    state: >
      {% set dev = states('sensor.bedroom_temperature_deviation') | float %}
      {% set threshold = states('input_number.deviation_threshold') | float(2) %}
      {# Trigger at threshold, but continue until setpoint reached #}
      {% set currently_out = states('sensor.bedroom_out_of_setpoint') == 'True' %}
      {% if dev >= threshold %}cool
      {% elif dev <= -threshold %}heat
      {% elif currently_out and dev > 0 %}cool
      {% elif currently_out and dev < 0 %}heat
      {% else %}none
      {% endif %}

  # ==========================================================
  # Office
  # ==========================================================
  - name: office_temperature_deviation
    unit_of_measurement: "°F"
    state: >
      {{ (states('sensor.temperature_sensor_office_temperature') | float -
         states('input_number.office_setpoint') | float) | round(1) }}

  - name: office_out_of_setpoint
    state: >
      {% set dev = states('sensor.office_temperature_deviation') | float %}
      {% set is_night = is_state('binary_sensor.hvac_night_mode', 'on') %}
      {% set threshold = states('input_number.night_non_priority_threshold') | float(6) if is_night else states('input_number.deviation_threshold') | float(2) %}
      {{ dev | abs >= threshold }}

  - name: office_target_direction
    state: >
      {% set dev = states('sensor.office_temperature_deviation') | float %}
      {% set is_night = is_state('binary_sensor.hvac_night_mode', 'on') %}
      {% set threshold = states('input_number.night_non_priority_threshold') | float(6) if is_night else states('input_number.deviation_threshold') | float(2) %}
      {# Trigger at threshold, but continue until setpoint reached #}
      {% set currently_out = states('sensor.office_out_of_setpoint') == 'True' %}
      {% if dev >= threshold %}cool
      {% elif dev <= -threshold %}heat
      {% elif currently_out and dev > 0 %}cool
      {% elif currently_out and dev < 0 %}heat
      {% else %}none
      {% endif %}

  # ==========================================================
  # Living Room
  # ==========================================================
  - name: living_room_temperature_deviation
    unit_of_measurement: "°F"
    state: >
      {{ (states('sensor.temperature_sensor_living_room_temperature') | float -
         states('input_number.living_room_setpoint') | float) | round(1) }}

  - name: living_room_out_of_setpoint
    state: >
      {% set dev = states('sensor.living_room_temperature_deviation') | float %}
      {% set is_night = is_state('binary_sensor.hvac_night_mode', 'on') %}
      {% set threshold = states('input_number.night_non_priority_threshold') | float(6) if is_night else states('input_number.deviation_threshold') | float(2) %}
      {{ dev | abs >= threshold }}

  - name: living_room_target_direction
    state: >
      {% set dev = states('sensor.living_room_temperature_deviation') | float %}
      {% set is_night = is_state('binary_sensor.hvac_night_mode', 'on') %}
      {% set threshold = states('input_number.night_non_priority_threshold') | float(6) if is_night else states('input_number.deviation_threshold') | float(2) %}
      {# Trigger at threshold, but continue until setpoint reached #}
      {% set currently_out = states('sensor.living_room_out_of_setpoint') == 'True' %}
      {% if dev >= threshold %}cool
      {% elif dev <= -threshold %}heat
      {% elif currently_out and dev > 0 %}cool
      {% elif currently_out and dev < 0 %}heat
      {% else %}none
      {% endif %}

  # ==========================================================
  # First Floor / Guest Area
  # ==========================================================
  - name: first_floor_temperature_deviation
    unit_of_measurement: "°F"
    state: >
      {{ (states('sensor.temperature_sensor_first_floor_temperature') | float -
         states('input_number.first_floor_setpoint') | float) | round(1) }}

  - name: first_floor_out_of_setpoint
    state: >
      {% set dev = states('sensor.first_floor_temperature_deviation') | float %}
      {% set is_night = is_state('binary_sensor.hvac_night_mode', 'on') %}
      {% set threshold = states('input_number.night_non_priority_threshold') | float(6) if is_night else states('input_number.deviation_threshold') | float(2) %}
      {{ dev | abs >= threshold }}

  - name: first_floor_target_direction
    state: >
      {% set dev = states('sensor.first_floor_temperature_deviation') | float %}
      {% set is_night = is_state('binary_sensor.hvac_night_mode', 'on') %}
      {% set threshold = states('input_number.night_non_priority_threshold') | float(6) if is_night else states('input_number.deviation_threshold') | float(2) %}
      {# Trigger at threshold, but continue until setpoint reached #}
      {% set currently_out = states('sensor.first_floor_out_of_setpoint') == 'True' %}
      {% if dev >= threshold %}cool
      {% elif dev <= -threshold %}heat
      {% elif currently_out and dev > 0 %}cool
      {% elif currently_out and dev < 0 %}heat
      {% else %}none
      {% endif %}

  # ==========================================================
  # Dynamic Sensor Offsets
  # ==========================================================
  # These sensors calculate the difference between the Sensibo/Mitsubishi
  # sensor reading and the authoritative Sonoff sensor. This offset is
  # used to adjust the setpoint sent to the head unit so it actually
  # achieves the desired temperature according to the Sonoff sensor.
  #
  # Positive offset = Mitsubishi reads higher than Sonoff
  # Negative offset = Mitsubishi reads lower than Sonoff
  #
  # Safeguards:
  # - Capped at ±8°F to prevent runaway values
  # - Rounded to nearest 1°F (Mitsubishi only accepts whole degrees)
  # - Defaults to 0 if either sensor is unavailable
  # ==========================================================

  # Raw offsets for dashboard display (shows tenths)
  - name: bedroom_sensor_offset_raw
    unit_of_measurement: "°F"
    state: >
      {% set mitsu = state_attr('climate.bedroom_air', 'current_temperature') %}
      {% set sonoff = states('sensor.temperature_sensor_bedroom_temperature') %}
      {% if mitsu is none or sonoff in ['unknown', 'unavailable'] %}
        0
      {% else %}
        {{ ((mitsu | float) - (sonoff | float)) | round(1) }}
      {% endif %}

  - name: office_sensor_offset_raw
    unit_of_measurement: "°F"
    state: >
      {% set mitsu = state_attr('climate.office_air', 'current_temperature') %}
      {% set sonoff = states('sensor.temperature_sensor_office_temperature') %}
      {% if mitsu is none or sonoff in ['unknown', 'unavailable'] %}
        0
      {% else %}
        {{ ((mitsu | float) - (sonoff | float)) | round(1) }}
      {% endif %}

  - name: living_room_sensor_offset_raw
    unit_of_measurement: "°F"
    state: >
      {% set mitsu = state_attr('climate.living_room_air', 'current_temperature') %}
      {% set sonoff = states('sensor.temperature_sensor_living_room_temperature') %}
      {% if mitsu is none or sonoff in ['unknown', 'unavailable'] %}
        0
      {% else %}
        {{ ((mitsu | float) - (sonoff | float)) | round(1) }}
      {% endif %}

  - name: first_floor_sensor_offset_raw
    unit_of_measurement: "°F"
    state: >
      {% set mitsu = state_attr('climate.shop_air', 'current_temperature') %}
      {% set sonoff = states('sensor.temperature_sensor_first_floor_temperature') %}
      {% if mitsu is none or sonoff in ['unknown', 'unavailable'] %}
        0
      {% else %}
        {{ ((mitsu | float) - (sonoff | float)) | round(1) }}
      {% endif %}

  # Rounded offsets for automation use (capped at ±8°F)
  - name: bedroom_sensor_offset
    unit_of_measurement: "°F"
    state: >
      {% set raw = states('sensor.bedroom_sensor_offset_raw') | float(0) %}
      {{ [[raw | round(0) | int, -8] | max, 8] | min }}

  - name: office_sensor_offset
    unit_of_measurement: "°F"
    state: >
      {% set raw = states('sensor.office_sensor_offset_raw') | float(0) %}
      {{ [[raw | round(0) | int, -8] | max, 8] | min }}

  - name: living_room_sensor_offset
    unit_of_measurement: "°F"
    state: >
      {% set raw = states('sensor.living_room_sensor_offset_raw') | float(0) %}
      {{ [[raw | round(0) | int, -8] | max, 8] | min }}

  - name: first_floor_sensor_offset
    unit_of_measurement: "°F"
    state: >
      {% set raw = states('sensor.first_floor_sensor_offset_raw') | float(0) %}
      {{ [[raw | round(0) | int, -8] | max, 8] | min }}
